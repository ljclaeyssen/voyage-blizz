<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blizzcon 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #06080f;
      --border-subtle: rgba(212, 160, 83, 0.12);
      --border-glow: rgba(212, 160, 83, 0.3);
      --amber: #d4a053;
      --amber-light: #e8c882;
      --amber-dim: #8a6a35;
      --cream: #f0e6d3;
      --cream-muted: #b8a891;
      --teal: #5ab8a6;
      --teal-dim: #2a6e62;
      --text-primary: #ede4d6;
      --text-secondary: #7a7062;
      --text-muted: #4a4238;
      --night-bg: rgba(42, 110, 98, 0.08);
      --night-border: rgba(90, 184, 166, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Film grain ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* ── Ambient glow ── */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
    }

    .ambient-orb:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #d4a053, transparent 70%);
      top: -200px; left: -100px;
      animation: drift1 25s ease-in-out infinite;
    }

    .ambient-orb:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #5ab8a6, transparent 70%);
      bottom: -200px; right: -100px;
      animation: drift2 30s ease-in-out infinite;
    }

    .ambient-orb:nth-child(3) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #d4a053, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.06;
      animation: drift3 20s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(80px, 40px); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-60px, -30px); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.3); }
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      padding: 3rem 4rem 4rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1.5rem;
      padding: 0.4rem 1rem;
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      background: rgba(212, 160, 83, 0.04);
    }

    .header-tag svg {
      width: 14px; height: 14px;
      stroke: var(--amber);
      fill: none;
      stroke-width: 1.5;
    }

    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      letter-spacing: 0.04em;
      line-height: 0.9;
      color: var(--cream);
      margin-bottom: 1rem;
    }

    .header h1 span {
      background: linear-gradient(135deg, var(--amber-light) 0%, var(--amber) 50%, var(--amber-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-dates {
      font-family: 'Cormorant', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: var(--cream-muted);
      letter-spacing: 0.02em;
    }

    .header-dates strong {
      color: var(--text-primary);
      font-weight: 600;
      font-style: normal;
    }

    /* ── Separator ── */
    .road-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .road-line-segment {
      height: 1px;
      flex: 1;
      max-width: 200px;
      background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
    }

    .road-line-dot {
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(212, 160, 83, 0.4);
    }

    /* ── Phase labels ── */
    .phase {
      opacity: 0;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .phase-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: var(--amber-dim);
      white-space: nowrap;
    }

    .phase-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--amber-dim), transparent);
      opacity: 0.4;
    }

    /* ── Day grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .grid-bottom {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
    }

    /* ── Day cards ── */
    .day {
      opacity: 0;
      transform: translateY(20px);
    }

    .day-inner {
      background: linear-gradient(165deg, rgba(20, 27, 38, 0.9), rgba(13, 17, 23, 0.95));
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.5rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(20px);
    }

    .day-inner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .day-inner:hover {
      border-color: var(--border-glow);
      transform: translateY(-4px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(212, 160, 83, 0.06);
    }

    .day-inner:hover::before { opacity: 1; }

    /* ── Day number watermark ── */
    .day-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      line-height: 1;
      color: rgba(212, 160, 83, 0.08);
      position: absolute;
      top: 0.75rem;
      right: 1rem;
      pointer-events: none;
      transition: color 0.4s ease;
    }

    .day-inner:hover .day-number {
      color: rgba(212, 160, 83, 0.15);
    }

    /* ── Day header ── */
    .day-header {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(212, 160, 83, 0.08);
    }

    .day-name {
      font-family: 'Cormorant', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--cream);
      line-height: 1.2;
    }

    .day-date {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 3px;
      letter-spacing: 0.03em;
    }

    /* ── Section titles ── */
    .section-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--amber-dim);
      margin-bottom: 0.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section-title svg {
      width: 11px; height: 11px;
      stroke: var(--amber-dim);
      fill: none;
      stroke-width: 1.5;
    }

    /* ── Activities ── */
    .activities {
      flex: 1;
      margin-bottom: 1rem;
    }

    .activity {
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
      border-radius: 8px;
      background: rgba(212, 160, 83, 0.04);
      border-left: 2px solid var(--amber-dim);
      line-height: 1.4;
      transition: all 0.25s ease;
    }

    .activity:hover {
      background: rgba(212, 160, 83, 0.08);
      border-left-color: var(--amber);
    }

    .activity.option {
      border-left: 2px dashed var(--amber-dim);
      background: rgba(212, 160, 83, 0.02);
    }

    .activity.option:hover {
      border-left-color: var(--amber);
    }

    .activity.option .option-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--amber);
      margin-right: 0.3rem;
    }

    .options-divider {
      text-align: center;
      font-family: 'Cormorant', serif;
      font-style: italic;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0.2rem 0;
    }

    .activity .price {
      color: var(--amber-dim);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .no-activity {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
      font-family: 'Cormorant', serif;
      padding: 0.3rem 0;
    }

    /* ── Night location ── */
    .night {
      background: var(--night-bg);
      border: 1px solid var(--night-border);
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      line-height: 1.35;
      margin-top: auto;
      transition: all 0.25s ease;
    }

    .night:hover {
      border-color: var(--teal);
      background: rgba(42, 110, 98, 0.12);
    }

    .night a {
      color: var(--teal);
      text-decoration: none;
      border-bottom: 1px dashed rgba(90, 184, 166, 0.3);
      transition: border-color 0.25s ease;
    }

    .night a:hover {
      border-bottom-color: var(--teal);
    }

    .night-icon { font-size: 0.9rem; flex-shrink: 0; }

    .night-text {
      color: var(--teal);
      font-weight: 500;
    }

    .night.undefined {
      border-style: dashed;
      opacity: 0.5;
    }

    .night.undefined .night-text {
      color: var(--text-muted);
      font-style: italic;
      font-family: 'Cormorant', serif;
    }

    /* ── Special day styling ── */
    .day.first .day-inner {
      border-color: rgba(212, 160, 83, 0.2);
      background: linear-gradient(165deg, rgba(30, 27, 20, 0.9), rgba(13, 17, 23, 0.95));
    }

    .day.last .day-inner {
      border-color: rgba(90, 184, 166, 0.15);
      background: linear-gradient(165deg, rgba(20, 30, 28, 0.9), rgba(13, 17, 23, 0.95));
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 3rem;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
    }

    .footer p {
      font-family: 'Cormorant', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 1200px) {
      .content { padding: 2rem 2rem 3rem; }
      .grid { grid-template-columns: repeat(3, 1fr); }
      .grid-bottom { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .content { padding: 1.5rem 1rem 2rem; }
      .header { margin-bottom: 2rem; }
      .header h1 { font-size: 3rem; }
      .road-line { margin-bottom: 2rem; }
      .grid, .grid-bottom {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
      .phase { margin-bottom: 0.75rem; }
      .day-inner { padding: 1.25rem; }
      .day-number { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
  </div>

  <div class="content">
    <header class="header">
      <div class="header-tag">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Septembre 2026
      </div>
      <h1 id="title"></h1>
      <div class="header-dates" id="subtitle"></div>
    </header>

    <div class="road-line">
      <div class="road-line-segment"></div>
      <div class="road-line-dot"></div>
      <div class="road-line-segment"></div>
    </div>

    <div class="phase" id="phase1">
      <span class="phase-label">Anaheim</span>
      <div class="phase-line"></div>
    </div>
    <div class="grid" id="grid-top"></div>

    <div class="phase" id="phase2">
      <span class="phase-label">Los Angeles</span>
      <div class="phase-line"></div>
    </div>
    <div class="grid-bottom" id="grid-bottom"></div>

    <footer class="footer">
      <p>Bon voyage.</p>
    </footer>
  </div>

  <script>
    fetch('data.json')
      .then(r => r.json())
      .then(data => render(data))
      .catch(() => {
        document.querySelector('.header').innerHTML = '<p style="color:var(--amber)">Impossible de charger data.json</p>';
      });

    function render(data) {
      const titleEl = document.getElementById('title');
      const parts = data.trip.title.split(' ');
      titleEl.innerHTML = parts.map((w, i) => i === 0 ? w : `<span>${w}</span>`).join(' ');

      document.getElementById('subtitle').innerHTML =
        `Du <strong>${formatDate(data.trip.startDate)}</strong> au <strong>${formatDate(data.trip.endDate)}</strong> — ${data.days.length} jours`;

      const splitAt = 5;
      const topDays = data.days.slice(0, splitAt);
      const bottomDays = data.days.slice(splitAt);

      const gridTop = document.getElementById('grid-top');
      const gridBottom = document.getElementById('grid-bottom');
      const phase1 = document.getElementById('phase1');
      const phase2 = document.getElementById('phase2');

      // Animate phase labels
      setTimeout(() => {
        phase1.style.transition = 'opacity 0.6s ease';
        phase1.style.opacity = '1';
      }, 600);
      setTimeout(() => {
        phase2.style.transition = 'opacity 0.6s ease';
        phase2.style.opacity = '1';
      }, 600 + splitAt * 80 + 200);

      topDays.forEach((day, i) => {
        gridTop.appendChild(createDayCard(day, i, 0));
      });

      bottomDays.forEach((day, i) => {
        gridBottom.appendChild(createDayCard(day, i + splitAt, splitAt));
      });
    }

    function createDayCard(day, globalIndex, offset) {
      const col = document.createElement('div');
      col.className = 'day';
      if (globalIndex === 0) col.classList.add('first');

      const labelParts = day.label.split(' ');
      const dayName = labelParts[0];
      const dateStr = labelParts.slice(1).join(' ');

      let html = `
        <div class="day-inner">
          <div class="day-number">J${globalIndex + 1}</div>
          <div class="day-header">
            <div class="day-name">${dayName}</div>
            <div class="day-date">${dateStr}</div>
          </div>
          <div class="activities">
            <div class="section-title">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
              Activités
            </div>
      `;

      if (day.activities.length > 0) {
        let prevWasOption = false;
        day.activities.forEach((a, idx) => {
          const optionMatch = a.match(/^(Option [A-Z])\s*—\s*(.*)/);
          if (optionMatch) {
            if (prevWasOption) {
              html += `<div class="options-divider">ou</div>`;
            }
            const tag = optionMatch[1];
            const rest = optionMatch[2];
            const priceMatch = rest.match(/(\(~?\$[\d,.\-\/]+(?:\/pers)?\))/);
            if (priceMatch) {
              const text = rest.replace(priceMatch[0], '').trim();
              html += `<div class="activity option"><span class="option-tag">${escapeHtml(tag)}</span> ${escapeHtml(text)} <span class="price">${escapeHtml(priceMatch[1])}</span></div>`;
            } else {
              html += `<div class="activity option"><span class="option-tag">${escapeHtml(tag)}</span> ${escapeHtml(rest)}</div>`;
            }
            prevWasOption = true;
          } else {
            prevWasOption = false;
            const priceMatch = a.match(/(\(~?\$[\d,.\-\/]+(?:\/pers)?\))/);
            if (priceMatch) {
              const text = a.replace(priceMatch[0], '').trim();
              html += `<div class="activity">${escapeHtml(text)} <span class="price">${escapeHtml(priceMatch[1])}</span></div>`;
            } else {
              html += `<div class="activity">${escapeHtml(a)}</div>`;
            }
          }
        });
      } else {
        html += `<div class="no-activity">Rien de prévu</div>`;
      }

      html += `</div>`;

      if (day.nightLocation !== null) {
        const isUndefined = day.nightLocation === 'À définir';
        const nightParts = day.nightLocation.split('|');
        const nightName = nightParts[0];
        const nightUrl = nightParts[1] || null;
        const nightContent = nightUrl
          ? `<a href="${escapeHtml(nightUrl)}" target="_blank" rel="noopener">${escapeHtml(nightName)}</a>`
          : escapeHtml(nightName);
        html += `
          <div class="section-title" style="margin-top: auto;">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            Nuit
          </div>
          <div class="night ${isUndefined ? 'undefined' : ''}">
            <span class="night-icon">&#9790;</span>
            <span class="night-text">${nightContent}</span>
          </div>
        `;
      }

      html += `</div>`;
      col.innerHTML = html;

      // Check if this is the last day
      if (day.nightLocation === null && day.activities.some(a => a.toLowerCase().includes('retour'))) {
        col.classList.add('last');
      }

      setTimeout(() => {
        col.style.transition = 'opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1)';
        col.style.opacity = '1';
        col.style.transform = 'translateY(0)';
      }, 800 + globalIndex * 100);

      return col;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
